# Subject: Azure CI security pipeline for GitHub Action (YAML File) CD deployment.
name: ResumeProPrjCICT-Pipeline # First-Azure-Pipeline

trigger: none

resources:
  repositories:
    - repository: application
      type: github
      name: LaSalleCollegeResume1311157/Resume # MY-GITHUB-ORG/YOUR-REPOSITORY
      endpoint: 9959bcd1-1e40-4075-a804-eac0808e2926 # MY-GITHUB-SERVICE-CONNECTION
      ref: refs/heads/main
      trigger:
        branches:
          include:
            - main

variables:
  nodeVersion: '20.x'
  workingDirectory: '$(Pipeline.Workspace)/application'
  artifactName: 'webapp'
  azureServiceConnection: 276d37ae-840f-46b8-a7f5-8d8536a10bb3 # 'MY-AZURE-SERVICE-CONNECTION'
  azureWebAppName: MY-PRODUCTION-AZURE-WEB-APP #'MY-AZURE-WEB-APP-NAME'

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: BuildApplication
        displayName: Build GitHub application
        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: application
            clean: true
            fetchDepth: 1
            path: application

          - task: NodeTool@0
            displayName: Install Node.js
            inputs:
              versionSpec: $(nodeVersion)

          - bash: |
              set -euo pipefail
              npm ci
              npm test --if-present
              npm run build --if-present
            displayName: Install, test, and build
            workingDirectory: $(workingDirectory)

          - task: ArchiveFiles@2
            displayName: Package application
            inputs:
              rootFolderOrFile: $(workingDirectory)
              includeRootFolder: false
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/$(artifactName).zip'
            artifact: $(artifactName)
            displayName: Publish deployment artifact

  - stage: Deploy
    displayName: Deploy website or service
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployApplication
        displayName: Deploy to Azure App Service
        environment: production
        pool:
          vmImage: ubuntu-latest

        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs do not automatically check out source.
                - checkout: none

                - download: current
                  artifact: $(artifactName)

                - task: AzureWebApp@1
                  displayName: Deploy application
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(azureWebAppName)
                    package: '$(Pipeline.Workspace)/$(artifactName)/$(artifactName).zip'
